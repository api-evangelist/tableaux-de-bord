naftiko: 1.0.0-alpha2
info:
  label: Grafana Dashboard API
  description: The Grafana HTTP API provides programmatic access to dashboard management, datasource configuration, organization
    management, user administration, annotation management, and alerting. Grafana is an open-source observability and analytics
    platform for infrastructure, application, and business monitoring.
  tags:
  - Tableaux
  - De
  - Bord
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: tableaux-de-bord
    baseUri: https://localhost:3000/api
    description: Grafana Dashboard API HTTP API.
    authentication:
      type: basic
      username: '{{TABLEAUX_DE_BORD_USERNAME}}'
      password: '{{TABLEAUX_DE_BORD_PASSWORD}}'
    resources:
    - name: dashboards-db
      path: /dashboards/db
      operations:
      - name: createorupdatedashboard
        method: POST
        description: Create Or Update Dashboard
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: dashboards-uid-uid
      path: /dashboards/uid/{uid}
      operations:
      - name: getdashboardbyuid
        method: GET
        description: Get Dashboard By UID
        inputParameters:
        - name: uid
          in: path
          type: string
          required: true
          description: Dashboard unique identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletedashboardbyuid
        method: DELETE
        description: Delete Dashboard By UID
        inputParameters:
        - name: uid
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: search
      path: /search
      operations:
      - name: searchdashboards
        method: GET
        description: Search Dashboards
        inputParameters:
        - name: query
          in: query
          type: string
          description: Search query string
        - name: tag
          in: query
          type: string
          description: Filter by tag
        - name: type
          in: query
          type: string
          description: Resource type filter
        - name: folderIds
          in: query
          type: array
          description: Folder IDs to search within
        - name: limit
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: datasources
      path: /datasources
      operations:
      - name: listdatasources
        method: GET
        description: List Datasources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createdatasource
        method: POST
        description: Create Datasource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: datasources-id
      path: /datasources/{id}
      operations:
      - name: getdatasourcebyid
        method: GET
        description: Get Datasource By ID
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatedatasource
        method: PUT
        description: Update Datasource
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletedatasource
        method: DELETE
        description: Delete Datasource
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: orgs
      path: /orgs
      operations:
      - name: listorganizations
        method: GET
        description: List Organizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createorganization
        method: POST
        description: Create Organization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: org-users
      path: /org/users
      operations:
      - name: listorgusers
        method: GET
        description: List Organization Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: teams-search
      path: /teams/search
      operations:
      - name: searchteams
        method: GET
        description: Search Teams
        inputParameters:
        - name: query
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: perpage
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: annotations
      path: /annotations

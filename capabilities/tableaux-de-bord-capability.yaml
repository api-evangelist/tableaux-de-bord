        method: GET
        description: List Annotations
        inputParameters:
        - name: from
          in: query
          type: integer
          description: Start time in milliseconds
        - name: to
          in: query
          type: integer
          description: End time in milliseconds
        - name: dashboardId
          in: query
          type: integer
        - name: panelId
          in: query
          type: integer

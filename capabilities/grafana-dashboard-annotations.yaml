naftiko: 1.0.0-alpha2
info:
  label: Grafana Dashboard API — Annotations
  description: 'Grafana Dashboard API — Annotations. 2 operations. Lead operation: List Annotations. Self-contained Naftiko
    capability covering one Tableaux De Bord business surface.'
  tags:
  - Tableaux De Bord
  - Annotations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TABLEAUX_DE_BORD_API_KEY: TABLEAUX_DE_BORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-dashboard-annotations
    baseUri: https://{grafana-host}/api
    description: Grafana Dashboard API — Annotations business capability. Self-contained, no shared references.
    resources:
    - name: annotations
      path: /annotations
      operations:
      - name: listannotations
        method: GET
        description: List Annotations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          description: Start time in milliseconds
        - name: to
          in: query
          type: integer
          description: End time in milliseconds
        - name: dashboardId
          in: query
          type: integer
        - name: panelId
          in: query
          type: integer
        - name: tags
          in: query
          type: array
        - name: limit
          in: query
          type: integer
      - name: createannotation
        method: POST
        description: Create Annotation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.TABLEAUX_DE_BORD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-dashboard-annotations-rest
    port: 8080
    description: REST adapter for Grafana Dashboard API — Annotations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/annotations
      name: annotations
      description: REST surface for annotations.
      operations:
      - method: GET
        name: listannotations
        description: List Annotations
        call: grafana-dashboard-annotations.listannotations
        with:
          from: rest.from
          to: rest.to
          dashboardId: rest.dashboardId
          panelId: rest.panelId
          tags: rest.tags
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createannotation
        description: Create Annotation
        call: grafana-dashboard-annotations.createannotation
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-dashboard-annotations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana Dashboard API — Annotations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-annotations
      description: List Annotations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-dashboard-annotations.listannotations
      with:
        from: tools.from
        to: tools.to
        dashboardId: tools.dashboardId
        panelId: tools.panelId
        tags: tools.tags
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-annotation
      description: Create Annotation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-dashboard-annotations.createannotation
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

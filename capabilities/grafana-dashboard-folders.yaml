naftiko: 1.0.0-alpha2
info:
  label: Grafana Dashboard API — Folders
  description: 'Grafana Dashboard API — Folders. 2 operations. Lead operation: List Folders. Self-contained Naftiko capability
    covering one Tableaux De Bord business surface.'
  tags:
  - Tableaux De Bord
  - Folders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TABLEAUX_DE_BORD_API_KEY: TABLEAUX_DE_BORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-dashboard-folders
    baseUri: https://{grafana-host}/api
    description: Grafana Dashboard API — Folders business capability. Self-contained, no shared references.
    resources:
    - name: folders
      path: /folders
      operations:
      - name: listfolders
        method: GET
        description: List Folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createfolder
        method: POST
        description: Create Folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.TABLEAUX_DE_BORD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-dashboard-folders-rest
    port: 8080
    description: REST adapter for Grafana Dashboard API — Folders. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/folders
      name: folders
      description: REST surface for folders.
      operations:
      - method: GET
        name: listfolders
        description: List Folders
        call: grafana-dashboard-folders.listfolders
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createfolder
        description: Create Folder
        call: grafana-dashboard-folders.createfolder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-dashboard-folders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana Dashboard API — Folders. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-folders
      description: List Folders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-dashboard-folders.listfolders
      outputParameters:
      - type: object
        mapping: $.
    - name: create-folder
      description: Create Folder
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-dashboard-folders.createfolder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

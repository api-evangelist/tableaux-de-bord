naftiko: 1.0.0-alpha2
info:
  label: Grafana Dashboard API — Teams
  description: 'Grafana Dashboard API — Teams. 1 operations. Lead operation: Search Teams. Self-contained Naftiko capability
    covering one Tableaux De Bord business surface.'
  tags:
  - Tableaux De Bord
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TABLEAUX_DE_BORD_API_KEY: TABLEAUX_DE_BORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-dashboard-teams
    baseUri: https://{grafana-host}/api
    description: Grafana Dashboard API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: teams-search
      path: /teams/search
      operations:
      - name: searchteams
        method: GET
        description: Search Teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: perpage
          in: query
          type: integer
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.TABLEAUX_DE_BORD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-dashboard-teams-rest
    port: 8080
    description: REST adapter for Grafana Dashboard API — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/teams/search
      name: teams-search
      description: REST surface for teams-search.
      operations:
      - method: GET
        name: searchteams
        description: Search Teams
        call: grafana-dashboard-teams.searchteams
        with:
          query: rest.query
          page: rest.page
          perpage: rest.perpage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-dashboard-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana Dashboard API — Teams. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-teams
      description: Search Teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-dashboard-teams.searchteams
      with:
        query: tools.query
        page: tools.page
        perpage: tools.perpage
      outputParameters:
      - type: object
        mapping: $.

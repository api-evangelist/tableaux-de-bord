aid: tableaux-de-bord
name: Tableaux De Bord
description: >-
  Tableaux de Bord (French for "dashboards") is an API industry topic covering dashboard and data visualization APIs.
  The landscape includes open-source platforms such as Grafana (with its comprehensive HTTP API for dashboards,
  datasources, and alerting) and Metabase (with its REST API for questions, dashboards, and administration). These tools
  enable programmatic creation and management of business intelligence dashboards for monitoring, analytics, and
  operational visibility.
